# Second Delivery - local environment: Airflow 3.1.8 (LocalExecutor) + MySQL 8 Data Warehouse.
#
#   docker compose build
#   docker compose up -d          # Airflow UI: http://localhost:8080
#   docker compose up -d mysql    # only the Data Warehouse (to run the scripts by hand)
#
# Two databases, two purposes:  postgres = Airflow metadata  |  mysql = the Data Warehouse.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: btb-airflow:3.1.8
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # The same secrets must reach every Airflow component, otherwise tasks cannot authenticate
    # against the API server. Change them in .env for anything that is not a local test.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-only-jwt-secret-change-me-0123456789}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-local-only-api-secret-change-me-0123456789}
    # Local convenience: no login screen. Do NOT expose this port to a network.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # --- the pipeline (src/config.py reads these) ---
    PYTHONPATH: /opt/airflow/project
    DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-changeme}@mysql:3306/icfes_dw
    MYSQL_DATABASE: ${MYSQL_DATABASE:-icfes_dw}
    ICFES_SOURCE_DIR: /opt/airflow/project/data/source/icfes
    MEN_API_URL: ${MEN_API_URL:-https://www.datos.gov.co/resource/ji8i-4anb.json}
    SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN:-}
    MEN_MIN_YEAR_EXCLUSIVE: ${MEN_MIN_YEAR_EXCLUSIVE:-2021}
    COLEGIO_ATTR_POLICY: ${COLEGIO_ATTR_POLICY:-first}
    DUPLICATE_CONFLICT_POLICY: ${DUPLICATE_CONFLICT_POLICY:-block}
  volumes:
    - ./:/opt/airflow/project
    - ./logs:/opt/airflow/logs
  depends_on: &airflow-depends-on
    postgres:
      condition: service_healthy
    mysql:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: btb_airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: btb_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: icfes_dw
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: btb_airflow_init
    entrypoint: /bin/bash
    command: ["-c", "mkdir -p /opt/airflow/logs && airflow db migrate"]
    depends_on: *airflow-depends-on
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    container_name: btb_airflow_apiserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: btb_airflow_scheduler
    command: scheduler
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    container_name: btb_airflow_dag_processor
    command: dag-processor
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  mysql_data:
